[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synology-dsm"
version = "0.6.0"
description = "Python library for Synology DSM API — shares, users, NFS, system management"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "python-dotenv"]
vault = ["hvac", "python-dotenv"]

[tool.ruff]
line-length = 100
target-version = "py310"
