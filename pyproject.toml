[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synology-dsm"
version = "0.8.0"
description = "Python library for Synology DSM API — shares, users, NFS, system management"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pre-commit", "detect-secrets", "pytest", "pytest-cov", "ruff", "mypy", "python-dotenv>=1.0", "commitizen"]
vault = ["hvac", "python-dotenv"]

[project.urls]
Homepage = "https://github.com/by-openclaw/lib-synology-dsm"
Repository = "https://github.com/by-openclaw/lib-synology-dsm"
Changelog = "https://github.com/by-openclaw/lib-synology-dsm/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = ["integration: live NAS required (deselect with -m 'not integration')"]
addopts = "--cov=src/synology_dsm --cov-report=term-missing --cov-report=html:htmlcov --cov-report=xml --cov-fail-under=80"

[tool.coverage.run]
source = ["src/synology_dsm"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.8.0"
version_files = [
    "pyproject.toml:^version",
    "src/synology_dsm/__init__.py:^__version__"
]
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "SIM105", "SIM117", "C408"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
