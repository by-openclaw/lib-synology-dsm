[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synology-dsm"
version = "0.7.3"
description = "Python library for Synology DSM API — shares, users, NFS, system management"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pre-commit", "detect-secrets", "pytest", "pytest-cov", "ruff", "mypy", "python-dotenv>=1.0", "commitizen"]
vault = ["hvac", "python-dotenv"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = ["integration: live NAS required (deselect with -m 'not integration')"]
addopts = "--cov=src/synology_dsm --cov-report=term-missing --cov-report=html:htmlcov --cov-report=xml --cov-fail-under=80"

[tool.coverage.run]
source = ["src/synology_dsm"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.7.3"
version_files = [
    "pyproject.toml:^version",
    "src/synology_dsm/__init__.py:^__version__"
]
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"

[tool.ruff]
line-length = 100
target-version = "py310"
