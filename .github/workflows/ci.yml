name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # run all versions even if one fails
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/synology_dsm/ tests/unit/ tests/integration/

      - name: Check formatting
        run: ruff format --check src/synology_dsm/ tests/unit/ tests/integration/

      - name: Type check
        run: mypy src/synology_dsm/ --ignore-missing-imports

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ \
            --cov=src/synology_dsm \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Upload coverage report (HTML)
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13'
        with:
          name: coverage-report-html
          path: htmlcov/
          retention-days: 30

      - name: Upload coverage report (XML)
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13'
        with:
          name: coverage-report-xml
          path: coverage.xml
          retention-days: 30

      # Codecov removed — coverage badge uses static shields.io (100%)
      # HTML + XML artifacts uploaded above (30-day retention via GitHub Actions)

  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tools + project deps
        run: |
          python -m pip install --upgrade pip  # ensures pip itself has no known CVEs
          pip install bandit pip-audit
          pip install -e ".[dev]"

      - name: Bandit — Python SAST
        # -r src/  : scan source only, not tests (fixtures use patterns Bandit flags)
        # -ll -ii  : medium+ severity AND medium+ confidence (reduces noise)
        run: bandit -r src/ -ll -ii

      - name: pip-audit — dependency CVE scan
        # --skip-editable: skip the lib itself (it has no declared deps)
        run: pip-audit --skip-editable
