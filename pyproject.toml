[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synology-dsm"
version = "0.9.0"
description = "Python library for Synology DSM API — shares, users, NFS, system management"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "BY-SYSTEMS", email = "engineering@by-systems.be" },
]
keywords = ["synology", "dsm", "nas", "api", "automation", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pre-commit", "detect-secrets", "pytest", "pytest-cov", "ruff", "mypy", "python-dotenv>=1.0", "commitizen", "build", "pygments>=2.20.0"]
vault = ["hvac", "python-dotenv"]

[project.urls]
Homepage = "https://github.com/by-openclaw/lib-synology-dsm"
Repository = "https://github.com/by-openclaw/lib-synology-dsm"
Changelog = "https://github.com/by-openclaw/lib-synology-dsm/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = ["integration: live NAS required (deselect with -m 'not integration')"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/synology_dsm"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.9.0"
version_files = [
    "pyproject.toml:^version",
    "src/synology_dsm/__init__.py:^__version__"
]
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "SIM105", "SIM117", "C408"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.bandit]
targets = ["src/"]
severity = "medium"
confidence = "medium"
skips = ["B101"]  # assert — intentional in source; tests already excluded from scan
