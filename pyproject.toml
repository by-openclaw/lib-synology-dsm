[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synology-dsm"
version = "0.7.0"
description = "Python library for Synology DSM API — shares, users, NFS, system management"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "python-dotenv", "commitizen"]
vault = ["hvac", "python-dotenv"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = ["integration: live NAS required (deselect with -m 'not integration')"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.7.0"
version_files = [
    "pyproject.toml:^version",
    "src/synology_dsm/__init__.py:^__version__"
]
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"

[tool.ruff]
line-length = 100
target-version = "py310"
